name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        # macos-14 defaults to an Xcode with Swift 5.10; the package needs 6.0.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start WireMock and wait for readiness
        # Version pin + readiness gate live in Scripts/start-wiremock.sh, shared
        # with the ios-xcuitest job and local Scripts/test.sh.
        run: Scripts/start-wiremock.sh
      - name: Start an auth-enabled WireMock (for the admin-auth suite)
        # A second instance on 8090 with Basic auth required, so
        # AdminAuthIntegrationTests actually runs (it XCTSkips without this).
        env:
          WIREMOCK_PORT: "8090"
          WIREMOCK_ADMIN_AUTH: "wmadmin:wmsecret"
          WIREMOCK_PID_FILE: ".wiremock-auth.pid"
        run: Scripts/start-wiremock.sh
      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test (unit + integration) with coverage
        env:
          # Fail (don't skip) the integration suites if the server isn't reachable.
          WIREMOCK_REQUIRED: "1"
          # Point the admin-auth suite at the auth-enabled instance above.
          WIREMOCK_AUTH_URL: "http://localhost:8090"
          WIREMOCK_AUTH_CREDS: "wmadmin:wmsecret"
        run: swift test --enable-code-coverage
      - name: Export code coverage (lcov)
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          PROF=$(find .build -name default.profdata | head -1)
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$PROF" \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            > coverage.lcov
          echo "coverage.lcov: $(grep -c '^SF:' coverage.lcov) files, $(wc -l < coverage.lcov) lines"
      - name: Enforce coverage threshold
        # Soft gate on Sources-only line coverage so a big regression fails the
        # build. The bar sits well below the current ~97% (see the report) to
        # absorb normal run-to-run jitter, not to chase 100%. Raise it as coverage
        # climbs; never above the actual number.
        env:
          MIN_COVERAGE: "90"
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          PROF=$(find .build -name default.profdata | head -1)
          BINPATH="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          PCT=$(xcrun llvm-cov export -summary-only -instr-profile "$PROF" "$BINPATH" Sources \
            | jq '.data[0].totals.lines.percent')
          echo "Sources line coverage: ${PCT}% (minimum ${MIN_COVERAGE}%)"
          awk -v c="$PCT" -v t="$MIN_COVERAGE" 'BEGIN { exit (c+0 < t+0) ? 1 : 0 }' || {
            echo "::error::line coverage ${PCT}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          }
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        # Not preinstalled on current macOS runner images.
        run: brew install swiftlint
      - name: Run SwiftLint
        # --strict: warnings fail the build. The tree is clean at this ruleset
        # (see .swiftlint.yml); keep it that way.
        run: swiftlint lint --strict --reporter github-actions-logging

  api-stability:
    name: API stability + snippets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the public API against the committed baseline
        # Fails if the public surface changed vs api/WireMock.api.json. `swift build`
        # inside the script also compiles the Snippets/ examples, so a rotted README
        # sample fails here too. Regenerate intentionally with Scripts/api-check.sh --update.
        run: Scripts/api-check.sh

  ios-build:
    name: iOS build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        # Pinned (not latest-stable) so the iOS toolchain — and the simulator
        # runtimes it ships — are reproducible run-to-run, like WireMock/Java.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Build the library for the iOS Simulator SDK
        # Proves the client compiles and links for iOS.
        run: xcodebuild build -scheme WireMockSwift -destination 'generic/platform=iOS Simulator'

  ios-sim-matrix:
    name: iOS sim device matrix
    runs-on: macos-14
    timeout-minutes: 10
    outputs:
      devices: ${{ steps.pick.outputs.devices }}
    steps:
      - name: Select the pinned iOS toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Pick several available popular iPhone simulators
        id: pick
        run: |
          set -euo pipefail
          # Actually-available iPhone model names on THIS image. A name can itself
          # contain parens (e.g. "iPhone SE (3rd generation)"), so strip only the
          # trailing " (UDID) (state)" — not everything after the first "(".
          AVAIL=$(xcrun simctl list devices available \
            | grep -E '^ *iPhone' \
            | sed -E 's/^ *//; s/ \([0-9A-F-]{36}\).*$//' \
            | sort -u)
          echo "Available iPhone models:"; echo "$AVAIL"
          # Prefer a small/standard/large spread of popular models across recent
          # generations; only names actually present are kept, and a fallback stops
          # an image bump from ever emptying the matrix.
          SEL=""
          for want in \
            "iPhone SE (3rd generation)" \
            "iPhone 15" "iPhone 15 Pro Max" \
            "iPhone 16" "iPhone 16 Pro Max" \
            "iPhone 17" "iPhone 17 Pro Max"; do
            if echo "$AVAIL" | grep -Fxq "$want"; then
              SEL="$SEL$want"$'\n'
            fi
          done
          # Fallback: first 3 available if none of the curated names matched.
          if [ -z "$SEL" ]; then
            SEL=$(echo "$AVAIL" | head -3)
          fi
          # De-dupe, cap at 3, emit a JSON array for the matrix.
          DEVICES=$(printf '%s\n' "$SEL" | awk 'NF && !seen[$0]++' | head -3 | jq -R . | jq -cs .)
          echo "Selected devices: $DEVICES"
          if [ "$DEVICES" = "[]" ]; then
            echo "::error::no iPhone simulators available on this image"; exit 1
          fi
          echo "devices=$DEVICES" >> "$GITHUB_OUTPUT"

  ios-xcuitest:
    name: iOS XCUITest (${{ matrix.device }})
    needs: ios-sim-matrix
    runs-on: macos-14
    # Guards against a wedged simulator boot / hung test running to the 6h default.
    timeout-minutes: 30
    strategy:
      # One model's failure still reports the others — don't cancel the whole matrix.
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.ios-sim-matrix.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start WireMock on the host
        run: Scripts/start-wiremock.sh
      - name: Generate and run the XCUITest example on the simulator
        working-directory: Examples/WireMockXCUIDemo
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          # Resolve the UDID for THIS matrix model by name. The name may contain
          # parens; matching the trailing " (" before the UDID disambiguates
          # "iPhone 16" from "iPhone 16 Pro". Guard emptiness LOUDLY (a missing model
          # is a clear failure, never a silent green).
          UDID=$(xcrun simctl list devices available \
            | grep -F "${{ matrix.device }} (" \
            | grep -oE '[0-9A-F-]{36}' | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::simulator '${{ matrix.device }}' is not available on this image"
            xcrun simctl list devices available
            exit 1
          fi
          # Self-document the exact device + OS runtime under test.
          echo "Using ${{ matrix.device }} → UDID $UDID"
          xcrun simctl list devices available | grep -F "$UDID" || true
          # Pre-boot and wait for full boot — a cold simulator's first network call
          # is the slowest, and the main cause of the simulator↔host reachability
          # flake; a warm simulator removes most of it. (-b boots then waits.)
          xcrun simctl bootstatus "$UDID" -b
          # TEST_RUNNER_* env vars are forwarded to the runner process (prefix
          # stripped): the test sees WIREMOCK_REQUIRED=1 (FAIL, don't XCTSkip) and CI
          # (so it can assert the required flag actually arrived — see the test's
          # guard). No -retry-tests-on-failure: a genuine flake stays visible and is
          # re-run manually, so real instability is never masked green.
          TEST_RUNNER_WIREMOCK_REQUIRED=1 \
          TEST_RUNNER_CI="${CI:-}" \
          xcodebuild test \
            -project WireMockXCUIDemo.xcodeproj -scheme SampleApp \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult
      - name: Collect simulator log (best effort)
        if: failure()
        run: |
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              > Examples/WireMockXCUIDemo/sim-log.txt 2>&1 || true
          fi
      - name: Upload failure forensics
        # The flakiest job now leaves evidence: the .xcresult (test logs + the
        # failure screenshot the test attaches), the WireMock server log, and a
        # recent simulator system-log slice.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcuitest-forensics-${{ matrix.device }}
          path: |
            Examples/WireMockXCUIDemo/TestResults.xcresult
            Examples/WireMockXCUIDemo/sim-log.txt
            wiremock-*.log
          if-no-files-found: ignore
