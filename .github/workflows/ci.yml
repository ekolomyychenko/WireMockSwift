name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        # macos-14 defaults to an Xcode with Swift 5.10; the package needs 6.0.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start WireMock and wait for readiness
        # Version pin + readiness gate live in Scripts/start-wiremock.sh, shared
        # with the ios-xcuitest job and local Scripts/test.sh.
        run: Scripts/start-wiremock.sh
      - name: Start an auth-enabled WireMock (for the admin-auth suite)
        # A second instance on 8090 with Basic auth required, so
        # AdminAuthIntegrationTests actually runs (it XCTSkips without this).
        env:
          WIREMOCK_PORT: "8090"
          WIREMOCK_ADMIN_AUTH: "wmadmin:wmsecret"
          WIREMOCK_PID_FILE: ".wiremock-auth.pid"
        run: Scripts/start-wiremock.sh
      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test (unit + integration) with coverage
        env:
          # Fail (don't skip) the integration suites if the server isn't reachable.
          WIREMOCK_REQUIRED: "1"
          # Point the admin-auth suite at the auth-enabled instance above.
          WIREMOCK_AUTH_URL: "http://localhost:8090"
          WIREMOCK_AUTH_CREDS: "wmadmin:wmsecret"
        run: swift test --enable-code-coverage
      - name: Export code coverage (lcov)
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          PROF=$(find .build -name default.profdata | head -1)
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$PROF" \
            "$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)" \
            > coverage.lcov
          echo "coverage.lcov: $(grep -c '^SF:' coverage.lcov) files, $(wc -l < coverage.lcov) lines"
      - name: Enforce coverage threshold
        # Soft gate on Sources-only line coverage so a big regression fails the
        # build. The bar sits well below the current ~97% (see the report) to
        # absorb normal run-to-run jitter, not to chase 100%. Raise it as coverage
        # climbs; never above the actual number.
        env:
          MIN_COVERAGE: "90"
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' | head -1)
          PROF=$(find .build -name default.profdata | head -1)
          BINPATH="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          PCT=$(xcrun llvm-cov export -summary-only -instr-profile "$PROF" "$BINPATH" Sources \
            | jq '.data[0].totals.lines.percent')
          echo "Sources line coverage: ${PCT}% (minimum ${MIN_COVERAGE}%)"
          awk -v c="$PCT" -v t="$MIN_COVERAGE" 'BEGIN { exit (c+0 < t+0) ? 1 : 0 }' || {
            echo "::error::line coverage ${PCT}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          }
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        # Not preinstalled on current macOS runner images.
        run: brew install swiftlint
      - name: Run SwiftLint
        # --strict: warnings fail the build. The tree is clean at this ruleset
        # (see .swiftlint.yml); keep it that way.
        run: swiftlint lint --strict --reporter github-actions-logging

  api-stability:
    name: API stability + snippets
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the public API against the committed baseline
        # Fails if the public surface changed vs api/WireMock.api.json. `swift build`
        # inside the script also compiles the Snippets/ examples, so a rotted README
        # sample fails here too. Regenerate intentionally with Scripts/api-check.sh --update.
        run: Scripts/api-check.sh

  ios-build:
    name: iOS build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select a Swift 6 toolchain
        # Pinned (not latest-stable) so the iOS toolchain — and the simulator
        # runtimes it ships — are reproducible run-to-run, like WireMock/Java.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Build the library for the iOS Simulator SDK
        # Proves the client compiles and links for iOS.
        run: xcodebuild build -scheme WireMockSwift -destination 'generic/platform=iOS Simulator'

  ios-xcuitest:
    # RELEASE coverage across the axis that actually carries risk for a headless
    # URLSession client: the iOS MAJOR version (URLSession/ATS/Foundation behaviour
    # forks there — this repo already carries old-Foundation workarounds). Model /
    # screen-size is irrelevant to this test, so we spend the budget on OS spread +
    # one iPad idiom cell instead of several phones on one OS. Each cell PINS its
    # runtime explicitly (an earlier version let simctl enumeration order pick the OS
    # by accident). iOS 15 is the compile floor only — its simulator is not bootable
    # on any current hosted runner (macos-13 retired; <16 won't run on macOS 14+), so
    # the lowest TESTED runtime is iOS 16 (downloaded at job time).
    name: iOS XCUITest (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # 40m: the iOS 16 cell adds a multi-GB runtime download before it can test.
    timeout-minutes: 40
    strategy:
      # One cell's failure still reports the others (and lets the flaky download cell
      # be re-run alone).
      fail-fast: false
      matrix:
        include:
          - name: "iOS 16 (floor)"
            runner: macos-14
            xcode: "16.2"
            os_major: "16"
            devicetype: "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation"
            idiom: iPhone
            download: "16.4"      # not preinstalled anywhere — download it
          - name: "iOS 17"
            runner: macos-14
            xcode: "15.4"          # ships the iOS 17.5 runtime
            os_major: "17"
            devicetype: "com.apple.CoreSimulator.SimDeviceType.iPhone-15"
            idiom: iPhone
            download: ""
          - name: "iOS 18"
            runner: macos-15
            xcode: "16.4"          # ships the iOS 18.6 runtime
            os_major: "18"
            devicetype: "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max"
            idiom: iPhone
            download: ""
          - name: "iOS 26 (latest)"
            runner: macos-15
            xcode: latest-stable   # newest Xcode → newest iOS 26.x runtime
            os_major: "26"
            devicetype: "com.apple.CoreSimulator.SimDeviceType.iPhone-17"
            idiom: iPhone
            download: ""
          - name: "iPad iOS 18"
            runner: macos-14
            xcode: "16.2"
            os_major: "18"
            devicetype: "com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation"
            idiom: iPad
            download: ""
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start WireMock on the host
        run: Scripts/start-wiremock.sh
      - name: Run the XCUITest example on ${{ matrix.name }}
        working-directory: Examples/WireMockXCUIDemo
        env:
          OS_MAJOR: ${{ matrix.os_major }}
          DEVICETYPE: ${{ matrix.devicetype }}
          IDIOM: ${{ matrix.idiom }}
          DOWNLOAD: ${{ matrix.download }}
          CELL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          # Download the pinned runtime if it isn't preinstalled (the iOS 16 floor).
          # Apple's CDN is flaky here, so retry a few times before giving up.
          if [ -n "$DOWNLOAD" ]; then
            echo "Downloading iOS $DOWNLOAD runtime ..."
            ok=""
            for i in 1 2 3; do
              if xcodebuild -downloadPlatform iOS -buildVersion "$DOWNLOAD"; then ok=1; break; fi
              echo "download attempt $i failed; retrying in 30s"; sleep 30
            done
            [ -n "$ok" ] || { echo "::error::failed to download iOS $DOWNLOAD runtime after 3 tries"; exit 1; }
          fi
          # Resolve the NEWEST installed runtime for the PINNED major. Pinning the
          # major (not a full x.y) keeps the OS-under-test explicit while tolerating
          # the image trimming a minor version; the exact version is logged below.
          RT=$(xcrun simctl list runtimes -j | jq -r --arg m "$OS_MAJOR" \
            '[.runtimes[] | select(.identifier|contains("iOS")) | select(.isAvailable==true) | select(.version|startswith($m+"."))] | sort_by(.version) | last | .identifier // ""')
          if [ -z "$RT" ]; then
            echo "::error::no available iOS $OS_MAJOR runtime on this image"; xcrun simctl list runtimes; exit 1
          fi
          VER=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT" '.runtimes[]|select(.identifier==$id)|.version')
          # Create the pinned device on that exact runtime (the UDID inherently pins
          # the OS for xcodebuild). Fall back to any pre-created device of the right
          # idiom if the specific model isn't available on this runtime.
          UDID=$(xcrun simctl create "wm-ci" "$DEVICETYPE" "$RT" 2>/dev/null || true)
          if [ -z "$UDID" ]; then
            echo "create of $DEVICETYPE failed; resolving an existing $IDIOM on iOS $VER"
            UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RT" --arg idiom "$IDIOM" \
              '(.devices[$rt] // []) | map(select(.name|test($idiom;"i"))) | .[0].udid // ""')
          fi
          [ -n "$UDID" ] || { echo "::error::no $IDIOM device available on iOS $VER"; xcrun simctl list devices; exit 1; }
          echo "Cell '$CELL' → $IDIOM on iOS $VER (UDID $UDID)"
          # Pre-boot and wait for full boot — a cold simulator's first network call is
          # the slowest, the main cause of the simulator↔host reachability flake.
          xcrun simctl bootstatus "$UDID" -b
          # TEST_RUNNER_* env vars are forwarded to the runner process (prefix
          # stripped): the test sees WIREMOCK_REQUIRED=1 (FAIL, don't XCTSkip) and CI
          # (so it can assert the required flag actually arrived). No auto-retry — a
          # genuine flake stays visible and is re-run manually.
          TEST_RUNNER_WIREMOCK_REQUIRED=1 \
          TEST_RUNNER_CI="${CI:-}" \
          xcodebuild test \
            -project WireMockXCUIDemo.xcodeproj -scheme SampleApp \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult
      - name: Collect simulator log (best effort)
        if: failure()
        run: |
          UDID=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1 || true)
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 3m --style compact \
              > Examples/WireMockXCUIDemo/sim-log.txt 2>&1 || true
          fi
      - name: Upload failure forensics
        # The flakiest job now leaves evidence: the .xcresult (test logs + the
        # failure screenshot the test attaches), the WireMock server log, and a
        # recent simulator system-log slice.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcuitest-forensics-${{ matrix.name }}
          path: |
            Examples/WireMockXCUIDemo/TestResults.xcresult
            Examples/WireMockXCUIDemo/sim-log.txt
            wiremock-*.log
          if-no-files-found: ignore
