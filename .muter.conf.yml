# Mutation-testing config for muter (https://github.com/muter-mutation-testing/muter).
# Run via Scripts/mutation.sh (on-demand, not per-PR — it is slow).
#
# Rationale: the golden-encoding suite compares the encoder output against
# hand-authored literals, so it is only as strong as those literals. Mutation
# testing perturbs the SOURCE (flip a boolean, drop a call, swap an operator) and
# checks the tests then FAIL — a surviving mutant in an encoder means a golden (or
# property) assertion is vacuous and must be tightened. Scope is the encoders.
#
# Uses the hermetic test command (no live server) so each mutant runs fast and
# deterministically; the encoders are fully exercised by the golden + property
# suites, which need no server.
#
# BLIND SPOT — read before trusting a clean run: this command runs `swift test`
# with NO live WireMock, and `--skip` matches test IDENTIFIERS, not superclasses.
# The server-delegated suites (RequestExpectationTests, RequestExpectationFailPathTests,
# OAuthFlowTests, …) aren't skipped by name, but their setUp throws `XCTSkip` when no
# server is reachable — so a mutant killable ONLY through them can never die here.
# Concretely, the logic in `expect(...)` that re-queries the server (`refine`/
# `refineNegative`/`makeError`'s too-many dump/`assertExactly`/every `to*`) is INVISIBLE
# to muter unless a pure or mocked (URLProtocol) test also pins it. Those server paths
# are instead verified by the live suites in CI (`WIREMOCK_REQUIRED=1`). Treat
# "mutation-clean" as strong evidence for the PURE building blocks (CountSpec, JSONPathLite,
# decodeURLEncoded, JWT, error rendering, orderingExists) — not for the server round-trips.
executable: /usr/bin/env
arguments:
  - swift
  - test
  - --skip
  - Integration
  - --skip
  - ResponseOptions
  - --skip
  - Live
  - --skip
  - ContractIntegration
exclude:
  - Tests
  - Examples
  - Snippets
  - Scripts
#
# muter version: this file is the CLASSIC pre-16 schema (dotted filename,
# space-separated file list, no `excludeCalls`). muter 16 changed all three AND
# regressed its schemata codegen (it mangles operators — e.g. `x > 0` -> `x > <` —
# into non-compiling source), so a run there aborts for the affected files.
#
# Do NOT edit this file to the 16 schema. `Scripts/mutation.sh` handles both:
# on pre-16 it uses THIS config directly; on 16+ it generates an equivalent
# non-dotted `muter.conf.yml` at runtime, cleans the stale `.build`, mutates one
# file per run, and skips the two files 16's codegen breaks
# (DSL/RequestExpectation.swift, DSL/CapturedRequest.swift — their logic is
# covered by targeted manual mutation). Drop that skip-list once the upstream
# codegen bug is fixed. Verified on this machine: 16 scores WireMock+Expect.swift
# (CountSpec) at 100%.
